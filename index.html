<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Intro</title>
    
    <!-- GSAP 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

    <style>
    /* =========================
       기본 세팅 및 화면 리셋
    ========================= */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    .pnsIntro {
        position: relative; width: 100%; height: 100vh; overflow: hidden; 
        background: #020406; color: #fff; font-family: 'Pretendard', sans-serif; 
        cursor: pointer; user-select: none;
    }

    .pnsIntro>.pnsBg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; z-index: 1; }
    .pnsIntro>.pnsBg>img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
    .pnsIntro>.pnsBg>.pnsOverlay { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: linear-gradient(90deg, rgba(2,4,6,0.92) 0%, rgba(2,4,6,0.65) 50%, rgba(2,4,6,0.92) 100%); }
    .pnsIntro>.pnsBg>.pnsLight { position: absolute; left: 50%; top: 50%; width: 800px; height: 800px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 193, 7, 0.1), transparent 70%); filter: blur(80px); transform: translate(-50%, -50%); }

    /* 쨍한 노란색 별자리 레이어 */
    .star-field { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 2; pointer-events: none; }
    .twinkle-star { position: absolute; width: 2px; height: 2px; background: #FFD54F; border-radius: 50%; opacity: 0; }

    /* =========================
       [임팩트 연출] 거대 유성 및 균열 이펙트
    ========================= */
    .intro-gate { position: absolute; top: 0; width: 50%; height: 100%; background: #05070b; z-index: 20; }
    .gate-left { left: 0; border-right: 1px solid rgba(255,193,7,0.05); }
    .gate-right { right: 0; border-left: 1px solid rgba(255,193,7,0.05); }

    .epic-meteor {
        position: absolute; z-index: 25; pointer-events: none;
        width: 4px; height: 300px;
        background: linear-gradient(180deg, #fff 0%, rgba(255, 193, 7, 0.9) 30%, transparent 100%);
        box-shadow: 0 0 25px 5px rgba(255, 152, 0, 0.7);
        transform: rotate(-40deg); opacity: 0;
        top: -350px; left: 70%;
    }

    .impact-flash {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0);
        width: 600px; height: 600px; border-radius: 50%;
        background: radial-gradient(circle, #fff 0%, rgba(255, 193, 7, 0.6) 20%, transparent 60%);
        z-index: 24; opacity: 0; pointer-events: none; filter: blur(10px);
    }

    .impact-crack {
        position: absolute; left: 50%; top: 0; transform: translateX(-50%);
        width: 3px; height: 0%; background: #fff;
        box-shadow: 0 0 35px 12px rgba(255, 152, 0, 0.85);
        z-index: 23; opacity: 0;
    }

    /* =========================
       안정적인 플렉스형 레이아웃 구조
    ========================= */
    .pnsWrap {
        position: relative; z-index: 5; width: 100%; height: 100vh; 
        max-width: 1500px; margin: 0 auto; padding: 50px 60px;
        display: flex; flex-direction: column; justify-content: space-between;
        opacity: 0; 
    }

    /* 로고 크기 증가 및 두둥실 애니메이션 */
    .introHeader { width: 100%; display: flex; justify-content: center; }
    .floating-logo { width: 240px; opacity: 0.95; animation: floatLogo 3.5s ease-in-out infinite; }
    /* 텍스트 로고 대체용 (이미지 대신 텍스트를 쓸 경우) */
    .text-logo { font-size: 28px; font-weight: 800; letter-spacing: 2px; color: #fff; animation: floatLogo 3.5s ease-in-out infinite; }

    @keyframes floatLogo {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
        100% { transform: translateY(0px); }
    }

    /* 중앙 본문 여백 축소 */
    .introBody {
        display: flex; justify-content: center; gap: clamp(60px, 8vw, 150px); align-items: center; 
        width: 100%; flex: 1; padding: 20px 0;
    }

    .titleGroup { max-width: 650px; }
    .titleGroup .subTitle { display: block; font-size: 15px; letter-spacing: 8px; color: #FFC107; margin-bottom: 20px; font-weight: 600; text-shadow: 0 0 10px rgba(255,193,7,0.3); }
    .titleGroup h2 { 
        font-size: clamp(38px, 4.5vw, 68px); line-height: 1.2; font-weight: 700; letter-spacing: -2px; margin: 0; word-break: keep-all; 
        background: linear-gradient(135deg, #FFFDE7 20%, #FFC107 70%, #FF9800 100%); 
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
    }

    .introService { margin-top: 35px; height: 30px; }
    .serviceText { display: block; font-size: clamp(18px, 1.6vw, 22px); font-weight: 400; letter-spacing: 0.5px; color: rgba(255, 213, 79, 0.85); }

    .countGroup { text-align: left; padding-left: clamp(40px, 5vw, 60px); border-left: 2px solid rgba(255, 193, 7, 0.2); min-width: 350px; }
    .countInfo { margin-bottom: 5px; display: flex; align-items: center; gap: 15px; }
    .countInfo .since { font-size: 15px; font-weight: 700; color: #FF9800; letter-spacing: 1px; }
    .countInfo .label { font-size: 13px; letter-spacing: 4px; color: rgba(255, 255, 255, 0.5); }
    .numberBox { display: block; font-size: clamp(80px, 8vw, 130px); line-height: 0.95; font-weight: 800; letter-spacing: -4px; }
    .numberBox .count { 
        font-style: normal; 
        background: linear-gradient(180deg, #FFFFFF 10%, #FFC107 70%, #FF5722 100%); 
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
        filter: drop-shadow(0 10px 20px rgba(255, 152, 0, 0.4)); 
    }

    .introFooter { 
        display: flex; 
        justify-content: space-between; 
        align-items: flex-end; 
        width: 100%; 
        border-top: 1px solid rgba(255, 193, 7, 0.1); 
        padding-top: 25px; 
    }

    .introYears { 
        display: flex; 
        align-items: baseline; 
        gap: 15px; 
    }

    /* 숫자 크기 뻥튀기 + 텍스트 그라데이션 + 네온 펄스 애니메이션 */
    .introYears strong { 
        font-size: clamp(55px, 6vw, 80px); 
        line-height: 0.9; 
        font-weight: 900; 
        background: linear-gradient(135deg, #FFFFFF 0%, #FFC107 50%, #FF5722 100%);
        -webkit-background-clip: text; 
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 20px rgba(255, 152, 0, 0.6));
        animation: pulseGlow 1.5s infinite alternate; 
    }

    /* 옆에 붙는 글자도 눈에 확 띄게 골드 컬러로 변경 */
    .introYears span { 
        font-size: clamp(12px, 1.2vw, 15px); 
        letter-spacing: 4px; 
        font-weight: 700;
        color: #FFD54F; 
        text-shadow: 0 0 10px rgba(255, 193, 7, 0.4);
    }

    /* 클릭 안내 가이드 */
    .click-anywhere { display: flex; flex-direction: column; align-items: center; gap: 10px; color: rgba(255, 213, 79, 0.4); font-size: 11px; letter-spacing: 5px; margin-right: 20px; transition: color 0.3s; }
    .pnsIntro:hover .click-anywhere { color: #FFC107; }
    .mouse-icon { width: 20px; height: 32px; border: 2px solid currentColor; border-radius: 12px; position: relative; }
    .mouse-icon .wheel { width: 2px; height: 5px; background: currentColor; position: absolute; top: 5px; left: 50%; transform: translateX(-50%); animation: mouseScroll 1.5s cubic-bezier(0.6, 0.04, 0.98, 0.33) infinite; }

    .introTransition { position: fixed; left: 0; top: 100%; width: 100%; height: 100%; background: #05070b; z-index: 9999; }

    @keyframes mouseScroll { 0% { opacity: 1; top: 5px; } 100% { opacity: 0; top: 15px; } }

    /* =========================
       반응형 모바일 최적화
    ========================= */
    @media(max-width:1200px){
        .pnsWrap { padding: 40px; }
        .introBody { flex-direction: column; align-items: center; justify-content: center; gap: 40px; text-align: center; }
        .titleGroup { text-align: center; }
        .countGroup { border-left: none; padding-left: 0; border-top: 1px solid rgba(255,193,7,0.2); padding-top: 30px; text-align: center; min-width: 100%; }
        .countInfo { justify-content: center; }
    }
    @media(max-width:768px) {
        .pnsWrap { padding: 30px 24px; }
        .floating-logo { width: 160px; }
        .titleGroup h2 { font-size: 32px; }
        .introService { margin-top: 20px; }
        .serviceText { font-size: 16px; }
        .numberBox { font-size: 70px; }
        .countInfo { flex-direction: column; align-items: center; gap: 2px; }
        .introFooter { flex-direction: column; align-items: center; gap: 25px; border-top: none; padding-top: 0; text-align: center; }
        .click-anywhere { margin-right: 0; }
    }
    </style>
</head>
<body>

    <div class="pnsIntro" id="pnsIntro">
        
        <div class="star-field"></div>

        <div class="epic-meteor"></div>
        <div class="impact-flash"></div>
        <div class="impact-crack"></div>

        <div class="intro-gate gate-left"></div>
        <div class="intro-gate gate-right"></div>

        <div class="pnsBg">
            <!-- 배경 이미지 경로에 맞게 수정하세요 -->
            <img src="/images/main/intro_bg.jpg" alt="Portfolio Background">
            <div class="pnsOverlay"></div>
            <div class="pnsLight"></div>
        </div>

        <div class="pnsWrap">
            
            <div class="introHeader">
                <div class="introLogo">
                    <!-- 개인 로고 이미지가 있다면 아래 img 태그 사용, 없다면 텍스트 로고 사용 -->
                    <!-- <img src="/images/main/my_logo.png" alt="My Logo" class="floating-logo"> -->
                    <div class="text-logo">PORTFOLIO.</div>
                </div>
            </div>

            <div class="introBody">
                <div class="titleGroup">
                    <!-- 포트폴리오용 문구로 수정 -->
                    <span class="subTitle lang-switch" data-en="FAST & PASSIONATE" data-ko="밀도 높은 몰입과 빠른 성장">FAST & PASSIONATE</span>
                    <h2 class="lang-switch" data-en="Web Developer<br>& UI/UX Designer" data-ko="프론트엔드 개발자<br>& 웹 퍼블리셔">Web Developer<br>& UI/UX Designer</h2>
                    <div class="introService">
                        <span class="serviceText" data-en="Frontend Development" data-ko="프론트엔드 개발">Frontend Development</span>
                    </div>
                </div>

                <div class="countGroup">
                    <div class="countInfo">
                        <span class="since lang-switch" data-en="INTENSE FOCUS" data-ko="밀도 있는 포트폴리오">INTENSE FOCUS</span>
                        <span class="label lang-switch" data-en="COMPLETED PROJECTS" data-ko="누적 완료 프로젝트">COMPLETED PROJECTS</span>
                    </div>
                    <strong class="numberBox">
                        <!-- 30~40개 중 임시로 35로 설정해두었습니다 -->
                        <span class="count" data-target="35">0</span>
                    </strong>
                </div>
            </div>

            <div class="introFooter">
                <div class="introYears">
                    <strong id="monthCounter">0</strong>
                    <!-- YEARS 대신 MONTHS 로 변경! -->
                    <span class="lang-switch" data-en="MONTHS OF EXPERIENCE" data-ko="개월의 실무 경험">MONTHS OF EXPERIENCE</span>
                </div>
                
                <div class="click-anywhere">
                    <span class="lang-switch" data-en="CLICK ANYWHERE TO ENTER" data-ko="화면을 클릭하여 입장하세요">CLICK ANYWHERE TO ENTER</span>
                    <div class="mouse-icon"><div class="wheel"></div></div>
                </div>
            </div>

        </div>
    </div>

    <div class="introTransition"></div>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const intro = document.querySelector(".pnsIntro");
        const bgImage = document.querySelector(".pnsBg img");
        const light = document.querySelector(".pnsLight");
        const projectCountEl = document.querySelector(".count");
        const monthCounterEl = document.getElementById("monthCounter");
        const serviceText = document.querySelector(".serviceText");

        // 경력 8개월 세팅
        const expMonths = 8; 
        const projectTarget = Number(projectCountEl.dataset.target) || 0;

        let currentLang = 'en';

        /* ==========================================
           1. 은은한 배경 밤하늘 별자리
        ========================================== */
        const starField = document.querySelector('.star-field');
        for(let i=0; i<120; i++) {
            let star = document.createElement('div');
            star.className = 'twinkle-star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            
            let size = Math.random() * 2 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.boxShadow = `0 0 ${Math.random() * 5 + 2}px rgba(255, 193, 7, 0.8)`;
            
            starField.appendChild(star);

            gsap.to(star, {
                opacity: Math.random() * 0.8 + 0.2,
                duration: Math.random() * 2 + 1,
                delay: Math.random() * 3,
                repeat: -1,
                yoyo: true,
                ease: "power1.inOut"
            });
        }

        /* ==========================================
           2. 오프닝 연출 애니메이션
        ========================================== */
        const openTimeline = gsap.timeline();
        gsap.set(bgImage, { scale: 1.3, opacity: 0.4 });
        gsap.set(".pnsWrap", { opacity: 1 });

        openTimeline
            .to(".epic-meteor", { top: "50%", left: "50%", opacity: 1, duration: 0.45, ease: "power2.in" })
            .set(".epic-meteor", { opacity: 0 })
            .to(".impact-flash", { scale: 1, opacity: 1, duration: 0.15, ease: "power1.out" })
            .to(".impact-flash", { opacity: 0, scale: 1.5, duration: 0.5, ease: "power2.out" }, "+=0.05")
            .to(".impact-crack", { height: "100%", opacity: 1, duration: 0.4, ease: "expo.out" }, "-=0.6")
            
            .to(".gate-left", { xPercent: -100, duration: 2.8, ease: "power4.inOut" }, "-=0.1")
            .to(".gate-right", { xPercent: 100, duration: 2.8, ease: "power4.inOut" }, "-=2.8")
            .to(".impact-crack", { opacity: 0, duration: 0.5 }, "-=2.3")

            .to(bgImage, { scale: 1.03, opacity: 1, duration: 3.5, ease: "power3.out" }, "-=2.5")

            .from(".introLogo", { opacity: 0, y: -20, duration: 1.2, ease: "power2.out" }, "-=2.0")
            .from(".titleGroup", { opacity: 0, x: -30, duration: 1.4, ease: "power3.out" }, "-=1.7")
            .from(".countGroup", { opacity: 0, x: 30, duration: 1.4, ease: "power3.out" }, "-=1.5")
            .from(".introFooter", { opacity: 0, y: 20, duration: 1.2, ease: "power2.out" }, "-=1.2")
            
            .call(startCounters, null, "-=1.2");


        /* ==========================================
           3. 숫자 카운터 작동 (개월 수 & 프로젝트 수)
        ========================================== */
        function startCounters() {
            let currentMonthObj = { val: 0 };
            gsap.to(currentMonthObj, { 
                val: expMonths, 
                duration: 1.8, 
                ease: "power2.out", 
                onUpdate: () => { monthCounterEl.innerText = Math.floor(currentMonthObj.val); } 
            });

            let currentProjectObj = { val: 0 };
            gsap.to(currentProjectObj, { 
                val: projectTarget, 
                duration: 2.6, 
                ease: "expo.out", 
                onUpdate: () => { projectCountEl.innerText = Math.floor(currentProjectObj.val).toLocaleString(); } 
            });
        }

        /* ==========================================
           4. 마우스 패럴랙스
        ========================================== */
        document.addEventListener("mousemove", function(e) {
            const x = (e.clientX / window.innerWidth - 0.5);
            const y = (e.clientY / window.innerHeight - 0.5);

            gsap.to(bgImage, { x: x * 20, y: y * 20, overwrite: "auto", duration: 1 });
            gsap.to(light, { x: `calc(-50% + ${x * 60}px)`, y: `calc(-50% + ${y * 60}px)`, overwrite: "auto", duration: 1.2 });
        });

        /* ==========================================
           5. 서비스(스킬) 순환 시스템
        ========================================== */
        const serviceList = [
            { en: "Frontend Development", ko: "프론트엔드 개발" },
            { en: "UI/UX Design", ko: "UI/UX 디자인" },
            { en: "Interactive Web", ko: "인터랙티브 웹 구현" },
            { en: "Responsive Publishing", ko: "반응형 웹 퍼블리싱" },
            { en: "Web Accessibility", ko: "웹 접근성 최적화" }
        ];
        let serviceIndex = 0;

        setInterval(function() {
            gsap.to(serviceText, { opacity: 0, y: -10, duration: 0.4, ease: "power2.in", overwrite: "auto", onComplete: () => {
                serviceIndex = (serviceIndex + 1) % serviceList.length;
                serviceText.setAttribute("data-en", serviceList[serviceIndex].en);
                serviceText.setAttribute("data-ko", serviceList[serviceIndex].ko);
                serviceText.innerText = serviceList[serviceIndex][currentLang];
                
                gsap.to(serviceText, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", overwrite: "auto" });
            }});
        }, 3200);

        /* ==========================================
           6. 영어 <-> 한글 다국어 자동 스위칭 시스템
        ========================================== */
        setTimeout(() => {
            const langElements = document.querySelectorAll(".lang-switch");
            
            setInterval(() => {
                currentLang = currentLang === 'en' ? 'ko' : 'en';
                const allLangToggles = [...langElements, serviceText];

                gsap.to(allLangToggles, {
                    opacity: 0,
                    y: -5,
                    duration: 0.4,
                    ease: "power2.in",
                    overwrite: "auto",
                    onComplete: () => {
                        allLangToggles.forEach(el => {
                            el.innerHTML = el.getAttribute(`data-${currentLang}`);
                        });
                        gsap.to(allLangToggles, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", overwrite: "auto" });
                    }
                });
            }, 4500); 
        }, 4500);


        /* ==========================================
           7. 전면부 스크린 클릭 시 메인페이지 진입
        ========================================== */
        let isEntering = false;

        intro.addEventListener("click", function() {
            if (isEntering) return;
            isEntering = true;
            intro.style.pointerEvents = "none";

            gsap.timeline()
                .to(intro, { opacity: 0, scale: 1.03, duration: 0.9, ease: "power2.inOut" })
                .to(".introTransition", { top: "0%", duration: 0.9, ease: "power2.inOut" }, 0)
                .call(() => { 
                    // 요청하신 /main.html 로 이동 세팅 완료!
                    location.href = "/main.html"; 
                }, null, 0.9);
        });

        document.addEventListener("keydown", function(e) { if (e.key === "Enter") intro.click(); });
    });
    </script>
</body>
</html>
